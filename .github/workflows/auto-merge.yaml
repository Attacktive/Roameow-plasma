name: 'Dependabot Auto-Merge'
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize', 'ready_for_review']
permissions:
  contents: 'write'
  pull-requests: 'write'
jobs:
  auto-merge:
    runs-on: 'ubuntu-latest'
    # 49699333 is the GitHub.com account ID for dependabot[bot].
    if: 'github.event.sender.id == 49699333 && github.event.pull_request.user.id == 49699333 && github.event.pull_request.head.repo.id == github.event.repository.id'
    steps:
      - name: 'Fetch Dependabot metadata'
        id: 'metadata'
        uses: 'dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Approve patch/minor PR'
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review "$PR_URL" --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: 'Enable Auto-Merge (Rebase)'
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: 'gh pr merge "$PR_URL" --auto --rebase'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
